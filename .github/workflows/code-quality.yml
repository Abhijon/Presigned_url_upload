name: Code Quality

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  code-quality:
    name: Lint & Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify Backend (Build Check)
        run: |
          cd backend
          npm ci
          npx prisma generate
          npm run build

      - name: Verify Frontend (Lint & Build Check)
        run: |
          cd frontend
          npm ci
          npm run lint
          npm run build
